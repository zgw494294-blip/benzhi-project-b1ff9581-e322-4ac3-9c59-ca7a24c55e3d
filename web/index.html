<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>古树病原鉴定与保护放行台</title><link rel="stylesheet" href="/app.css"></head><body><header><div class="brand"><span class="mark">古</span><div><strong>古树病原鉴定</strong><small>保护放行台 · FIELD DESK</small></div></div><div class="header-meta"><span class="live-dot"></span>同源服务在线 <span id="clock"></span></div></header><main><section class="intro"><div><p class="eyebrow">ANCIENT TREE PATHOGEN DESK</p><h1>让每一棵古树的保护决定<br><em>都有证据可循。</em></h1><p class="sub">从封签采样到复检放行，记录完整链路，守住古树健康底线。</p></div><div class="stats"><div><b id="caseCount">0</b><span>活跃案卷</span></div><div><b>7</b><span>今日交接</span></div><div><b class="amber">0</b><span>待复核</span></div></div></section><section class="workspace"><aside><div class="panel-head"><span>新建鉴定案卷</span><span class="step">01 / 06</span></div><form id="caseForm"><label>树木编号<input name="treeCode" placeholder="如 GZ-2024-001" required></label><label>树种<input name="species" placeholder="如 银杏" required></label><label>所在位置<input name="location" placeholder="如 东区古树园 3 号坡" ></label><label>权属单位<input name="owner" placeholder="如 市园林保护中心" ></label><label>登记人<input name="actor" placeholder="姓名" value="现场采样员" ></label><button>建立案卷 <span>→</span></button></form><div class="hint">建案后将自动冻结树木与采样基线</div></aside><article><div class="panel-head"><span>案卷工作流</span><div class="actions"><input id="caseID" placeholder="输入案卷 ID"><button class="ghost" id="loadBtn">载入</button></div></div><div class="searchbar"><input id="searchTree" placeholder="按树木编号检索"><select id="searchStatus"><option value="">全部状态</option><option>待取样</option><option>待检测</option><option>待复核</option><option>待复检</option><option>已放行</option><option>已驳回</option></select><button class="ghost" id="searchBtn">检索</button></div><div id="empty" class="empty"><div class="tree-icon">♧</div><h2>等待载入案卷</h2><p>创建新案卷或输入 ID 查看完整时间线</p></div><div id="detail" hidden></div></article></section></main><script src="/app.js"></script></body></html>
